<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <pattern id="crackedPatt" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 L20 0 L40 20 L20 40 Z" fill="none" stroke="#222" stroke-width="0.5"/>
    </pattern>
  </defs>
  <!-- Background Roadway -->
  <rect width="800" height="500" fill="url(#roadGrad)"/>
  <rect width="800" height="500" fill="url(#crackedPatt)" opacity="0.6"/>

  <!-- Curbstones -->
  <rect x="0" y="40" width="800" height="24" fill="#1f1f1f" stroke="#333" stroke-width="1"/>
  <rect x="0" y="440" width="800" height="24" fill="#1f1f1f" stroke="#333" stroke-width="1"/>

  <!-- Dashed Road Lane Line (Fractured) -->
  <line x1="20" y1="240" x2="160" y2="240" stroke="#FFF" stroke-width="8" stroke-dasharray="30 20" stroke-linecap="square"/>
  <line x1="620" y1="240" x2="780" y2="240" stroke="#FFF" stroke-width="8" stroke-dasharray="30 20" stroke-linecap="square"/>

  <!-- Severe Asphalt Crater & Fissures -->
  <path d="M 180 230 Q 230 140 340 130 Q 480 120 540 180 Q 640 230 580 320 Q 520 390 380 400 Q 240 390 200 320 Z" fill="#000000" stroke="#ff3333" stroke-width="2.5"/>

  <!-- Depressed Crater Layering & Sub-base Rubble -->
  <path d="M 220 230 Q 270 170 360 160 Q 460 160 510 200 Q 570 240 530 300 Q 480 350 370 360 Q 270 350 230 290 Z" fill="#0d0d0d" stroke="#666" stroke-width="1.5"/>
  <path d="M 270 230 Q 320 200 390 200 Q 450 210 470 250 Q 480 290 410 320 Q 330 320 290 280 Z" fill="#050505" stroke="#444" stroke-width="1"/>

  <!-- Cracks radiating from crater -->
  <path d="M 180 230 L 110 200 L 70 230 L 30 210" fill="none" stroke="#888" stroke-width="2"/>
  <path d="M 210 160 L 170 110 L 130 90" fill="none" stroke="#777" stroke-width="1.8"/>
  <path d="M 340 130 L 330 70 L 360 40" fill="none" stroke="#999" stroke-width="2.2"/>
  <path d="M 520 170 L 590 120 L 670 100" fill="none" stroke="#888" stroke-width="2"/>
  <path d="M 580 320 L 660 360 L 730 350 L 780 390" fill="none" stroke="#777" stroke-width="2.2"/>
  <path d="M 390 400 L 410 440 L 430 480" fill="none" stroke="#999" stroke-width="2"/>
  <path d="M 260 380 L 220 430 L 170 450" fill="none" stroke="#888" stroke-width="1.8"/>

  <!-- Loose Gravel / Broken Asphalt Blocks -->
  <polygon points="250,220 270,210 280,230 260,240" fill="#2a2a2a" stroke="#444"/>
  <polygon points="430,220 460,215 450,235 425,230" fill="#222" stroke="#555"/>
  <polygon points="360,280 390,270 385,300 355,295" fill="#1c1c1c" stroke="#444"/>
  <polygon points="310,250 330,245 325,265 305,260" fill="#2e2e2e" stroke="#666"/>
  <polygon points="460,270 485,265 480,290 455,285" fill="#222" stroke="#555"/>

  <!-- Hazard Barrier Cones -->
  <g transform="translate(140, 280)">
    <polygon points="20,0 5,60 35,60" fill="#ff4444"/>
    <polygon points="16,15 24,15 28,30 12,30" fill="#ffffff"/>
    <rect x="0" y="60" width="40" height="8" rx="2" fill="#222"/>
  </g>
  <g transform="translate(590, 160)">
    <polygon points="20,0 5,60 35,60" fill="#ff4444"/>
    <polygon points="16,15 24,15 28,30 12,30" fill="#ffffff"/>
    <rect x="0" y="60" width="40" height="8" rx="2" fill="#222"/>
  </g>

  <!-- Technical Watermark / HUD Overlay -->
  <rect x="24" y="24" width="310" height="64" rx="4" fill="#000000" fill-opacity="0.85" stroke="#ff3333" stroke-width="1"/>
  <text x="36" y="44" fill="#ff3333" font-family="monospace" font-size="12" font-weight="bold">🚨 CITIZEN EVIDENCE: CRITICAL ROAD COLLAPSE</text>
  <text x="36" y="60" fill="#FFFFFF" font-family="monospace" font-size="11">LOCATION: House No. 13 · South Access Lane</text>
  <text x="36" y="76" fill="#888888" font-family="monospace" font-size="10">CRATER SPAN: 1.6m · DEPTH: 22cm · RISK: AMBULANCE BLOCKED</text>

  <!-- Timestamp Stamp -->
  <rect x="540" y="420" width="236" height="48" rx="4" fill="#000" fill-opacity="0.85" stroke="#444" stroke-width="1"/>
  <text x="552" y="440" fill="#00ffcc" font-family="monospace" font-size="11">EVIDENCE #CMP-1042-GEO</text>
  <text x="552" y="456" fill="#888" font-family="monospace" font-size="9">GPS: 17.4126° N, 78.4391° E · VERIFIED</text>
</svg>